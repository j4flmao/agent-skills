# Free, deterministic checks on every push and pull request. No model calls, no secrets.
name: pr-static

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Governance (profiles, skill names, bundles)
        run: npm run validate:governance
      - name: Skills (structure, descriptions, reference links, secrets, deprecated APIs, freshness)
        run: npm run validate:skills
      - name: Generated docs are up to date (README, master summary, routing map, skill-advisor)
        run: npm run docs:check
      - name: Routing eval (description retriever must stay above thresholds)
        run: npm run eval:routing

  snippets:
    # Shell examples are fragments, so shellcheck findings are advisory: report, do not block.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Shellcheck fenced shell snippets (errors only)
        run: node scripts/lint-snippets.js

  links:
    # External links rot independently of PRs, so this job reports but does not block.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check external links in skills
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --cache --max-cache-age 7d
            --exclude-loopback
            --exclude '^https?://([\w-]+\.)*(example\.(com|org|net)|yourdomain\.com|evil\.com|localhost)\b'
            --exclude '^https?://[\w-]+(:\d+)?/'
            --exclude '^https?://[^/]+\.(internal|local|svc|cluster\.local)\b'
            --exclude '^https://github\.com/(team|your-org|myorg|org)/'
            --exclude-path 'skills/dev-loop/readme-writer/references'
            --accept 200,202,206,403,429
            'skills/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
